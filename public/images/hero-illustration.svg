<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EFE7D6"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- 紙のドット地紋 -->
  <g opacity="0.35">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.4" fill="#221F1B" opacity="0.15"/>
    </pattern>
    <rect width="1600" height="900" fill="url(#dots)"/>
  </g>

  <!-- 背景の大きな紙(傾き) -->
  <g transform="translate(1120 430) rotate(-8)">
    <rect x="-260" y="-330" width="520" height="660" rx="10" fill="#FFFFFF" stroke="#221F1B" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <!-- 手前の大きなスケッチブック -->
  <g transform="translate(660 470) rotate(-3)">
    <rect x="-420" y="-300" width="840" height="600" rx="14" fill="#FFFFFF" stroke="#221F1B" stroke-width="4"/>
    <!-- リング -->
    <g fill="none" stroke="#8C8578" stroke-width="6" stroke-linecap="round">
      <line x1="-380" y1="-300" x2="-380" y2="-330"/>
      <line x1="-300" y1="-300" x2="-300" y2="-330"/>
      <line x1="-220" y1="-300" x2="-220" y2="-330"/>
      <line x1="-140" y1="-300" x2="-140" y2="-330"/>
      <line x1="-60" y1="-300" x2="-60" y2="-330"/>
      <line x1="20" y1="-300" x2="20" y2="-330"/>
      <line x1="100" y1="-300" x2="100" y2="-330"/>
      <line x1="180" y1="-300" x2="180" y2="-330"/>
      <line x1="260" y1="-300" x2="260" y2="-330"/>
      <line x1="340" y1="-300" x2="340" y2="-330"/>
    </g>

    <!-- ページ中の線画(顔のラフスケッチ風) -->
    <g fill="none" stroke="#221F1B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M -60 -140 C -140 -140, -170 -60, -140 20 C -110 100, -20 140, 60 110 C 150 76, 170 -30, 120 -110 C 90 -156, 10 -170, -60 -140 Z"/>
      <path d="M -70 -20 C -40 10, 40 10, 70 -20"/>
      <path d="M -60 -60 C -40 -76, -10 -76, 6 -60"/>
      <path d="M 20 -60 C 40 -76, 70 -76, 90 -60"/>
      <path d="M 0 -30 C 10 -10, 10 10, -6 22"/>
    </g>

    <!-- マーカーの走り書き下線(サイン要素と統一) -->
    <path d="M -150 150 C -80 130, 20 175, 90 145 S 220 118, 300 150" fill="none" stroke="#E85D3F" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

    <!-- 色チップ -->
    <circle cx="-330" cy="200" r="20" fill="#3A4A8C" opacity="0.85"/>
    <circle cx="-270" cy="220" r="14" fill="#E85D3F" opacity="0.85"/>
    <circle cx="-330" cy="245" r="10" fill="#8C8578" opacity="0.7"/>
  </g>

  <!-- 鉛筆(手前に斜めに置かれている) -->
  <g transform="translate(1180 700) rotate(38)">
    <rect x="-14" y="-190" width="28" height="300" rx="6" fill="#3A4A8C"/>
    <path d="M -14 -190 L 0 -230 L 14 -190 Z" fill="#F1ECE0" stroke="#221F1B" stroke-width="2"/>
    <rect x="-14" y="90" width="28" height="24" fill="#221F1B"/>
    <rect x="-14" y="114" width="28" height="16" rx="4" fill="#E8664C"/>
  </g>

  <!-- インク瓶 -->
  <g transform="translate(280 640)">
    <path d="M -46 -10 h92 v70 a46 46 0 0 1 -92 0 z" fill="#221F1B"/>
    <rect x="-24" y="-46" width="48" height="40" rx="6" fill="#221F1B"/>
    <rect x="-30" y="-58" width="60" height="18" rx="6" fill="#3A4A8C"/>
    <ellipse cx="0" cy="18" rx="30" ry="10" fill="#3A4A8C" opacity="0.5"/>
  </g>

  <!-- 散らばった小さな紙 -->
  <g transform="translate(1360 260) rotate(12)">
    <rect x="-70" y="-90" width="140" height="180" rx="8" fill="#FFFFFF" stroke="#221F1B" stroke-opacity="0.15" stroke-width="2"/>
    <path d="M -40 -40 C -10 -70, 30 -50, 45 -10" fill="none" stroke="#8C8578" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
