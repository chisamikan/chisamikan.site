name: Notion更新の手動反映

# Notion/RSSの内容はビルド時にしか取得されないため、
# Cloudflare Workers BuildsのDeploy Hookを叩いて再ビルドをトリガーする。
# 定期実行はWorkerのCron Trigger(wrangler.toml の [triggers])で行っており、
# このワークフローはActionsタブから手動ですぐ反映したい時用。
# (GitHub Actionsのscheduleは数時間遅れることがあったため廃止した)
# (Deploy Hookの作成方法: Cloudflare Dashboard → Workers & Pages → 対象Worker →
#  Settings → Builds → Deploy Hooks。発行されたURLをリポジトリのSecret
#  `CF_DEPLOY_HOOK_URL` に登録しておくこと)
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare Deploy Hookを叩いて再ビルドをトリガー
        run: curl -sS -X POST -f "$CF_DEPLOY_HOOK_URL"
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
