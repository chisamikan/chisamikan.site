version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      # devDependenciesをまとめて1つのPRにする
      dev-dependencies:
        dependency-type: "development"
      # productionの依存はpatchとminorをグループ化
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7系(tsgo)はLanguage Service APIが未安定で、
      # Astroの言語サーバー(@astrojs/language-server 等)が対応するまでメジャー更新を保留
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
